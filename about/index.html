<!doctype html>
<html lang="ru-RU">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
        Разработчик в экосистеме competitive CS. — ESCA7A
    </title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../components/navigation/navigation.css">
    <link rel="stylesheet" href="../components/footer/footer.css">
</head>

<body>
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="../"> ESCA7A<span>.</span> </a>

            <nav class="nav-links" aria-label="Primary navigation">
                <a href="../"> Home </a>

                <a href="../projects/"> Projects </a>

                <a href="../publications/"> Publications </a>

                <a href="./" aria-current="page"> About </a>
            </nav>

            <div class="nav-actions">
                <label class="language-switcher">
                    <span class="sr-only"> Language </span>

                    <select data-language aria-label="Language">
                        <option value="ru-RU">RU</option>
                        <option value="en-US">EN</option>
                    </select>
                </label>

                <a href="https://github.com/ESCA7A" target="_blank" rel="noreferrer">
                    GitHub
                </a>
            </div>
        </div>
    </header>

    <main class="section-shell" style="padding: 120px 0">
        <div class="eyebrow" data-i18n="about.eyebrow">ABOUT</div>

        <h1 style="
               font-size: clamp(48px, 7vw, 84px);
               letter-spacing: -0.06em;
               max-width: 800px;
            " data-i18n="about.title">
            A developer in the competitive CS ecosystem.
        </h1>

        <p style="max-width: 620px; color: var(--muted); font-size: 18px" data-i18n="about.text">
            I experiment with tools, automation and interfaces that make
            competitive play more useful and help players improve.
        </p>
    </main>

    <footer class="site-footer">
        <div class="footer-shell">
            <span>
                © <span id="year"></span> ESCA7A —
                <span data-footer-text> Tools for CS2 and FACEIT. </span>
            </span>

            <a href="https://github.com/ESCA7A" target="_blank" rel="noreferrer">
                GitHub ↗
            </a>
        </div>
    </footer>

    <script type="module">
        import { SITE_CONFIG, I18N } from "../config/site.config.js";

        import { detectLocale, saveLocale } from "../config/loader.js";

        const languageSelect = document.querySelector("[data-language]");

        const eyebrow = document.querySelector('[data-i18n="about.eyebrow"]');

        const title = document.querySelector('[data-i18n="about.title"]');

        const text = document.querySelector('[data-i18n="about.text"]');

        const footerText = document.querySelector("[data-footer-text]");

        function render(locale) {
            const translations = I18N[locale];

            if (!translations) {
                return;
            }

            document.documentElement.lang = locale;

            document.title = `${translations.about.title} — ESCA7A`;

            eyebrow.textContent = translations.about.eyebrow;

            title.textContent = translations.about.title;

            text.textContent = translations.about.text;

            footerText.textContent = translations.footer.text;

            languageSelect.value = locale;
        }

        const initialLocale = detectLocale();

        render(initialLocale);

        languageSelect.addEventListener("change", (event) => {
            const locale = event.target.value;

            saveLocale(locale);

            render(locale);
        });

        document.querySelector("#year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
