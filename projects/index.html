<!doctype html>
<html lang="ru-RU">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Projects — ESCA7A</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../components/projects/projects.css">
</head>

<body>

<header class="site-header">

    <div class="nav-shell">

        <a
            class="brand"
            href="../"
            aria-label="ESCA7A"
        >
            ESCA7A<span>.</span>
        </a>

        <nav
            class="nav-links"
            aria-label="Primary navigation"
        >

            <a href="../">
                Home
            </a>

            <a
                href="./"
                aria-current="page"
            >
                Projects
            </a>

            <a href="../publications/">
                Publications
            </a>

            <a href="../about/">
                About
            </a>

        </nav>

        <div class="nav-actions">

            <label class="language-switcher">

                <span class="sr-only">
                    Language
                </span>

                <select
                    data-language
                    aria-label="Language"
                >
                    <option value="ru-RU">
                        RU
                    </option>

                    <option value="en-US">
                        EN
                    </option>
                </select>

            </label>

            <a
                href="https://github.com/ESCA7A"
                target="_blank"
                rel="noreferrer"
            >
                GitHub
            </a>

        </div>

    </div>

</header>


<main
    class="section-shell"
    style="padding:120px 0"
>

    <div class="eyebrow">
        PROJECTS
    </div>

    <h1
        style="
            font-size:clamp(48px,7vw,84px);
            letter-spacing:-.06em;
        "
    >
        Tools for CS2 & FACEIT.
    </h1>

    <div
        id="project-list"
        style="
            display:grid;
            gap:14px;
            margin-top:40px;
        "
    ></div>

</main>


<footer class="site-footer">

    <div class="footer-shell">

        <span>
            © <span id="year">2026</span> ESCA7A —
            <span data-footer-text>
                Инструменты для CS2 и FACEIT.
            </span>
        </span>

        <a
            href="https://github.com/ESCA7A"
            target="_blank"
            rel="noreferrer"
        >
            GitHub ↗
        </a>

    </div>

</footer>


<script type="module">

    import {
        getProjects,
        getPath,
        detectLocale,
        saveLocale
    } from '../config/loader.js';

    import {
        I18N
    } from '../config/site.config.js';


    const languageSelect =
        document.querySelector('[data-language]');

    const projectList =
        document.querySelector('#project-list');

    const footerText =
        document.querySelector('[data-footer-text]');


    function render(locale) {

        const translations = I18N[locale];

        if (!translations) {
            return;
        }

        document.documentElement.lang = locale;

        languageSelect.value = locale;

        footerText.textContent =
            translations.footer.text;

        projectList.innerHTML = '';


        getProjects().forEach(project => {

            const meta =
                project.meta[locale.split('-')[0]]
                || project.meta.en;

            projectList.insertAdjacentHTML(
                'beforeend',
                `
                <a
                    href="${getPath(project.route)}"
                    style="
                        display:block;
                        padding:28px;
                        border:1px solid var(--border);
                        border-radius:8px;
                        background:var(--surface);
                    "
                >
                    <strong style="font-size:28px">
                        ${meta.name}
                    </strong>

                    <div
                        style="
                            color:var(--muted);
                            margin-top:6px;
                        "
                    >
                        ${meta.short}
                    </div>
                </a>
                `
            );

        });

    }


    const initialLocale =
        detectLocale();

    render(initialLocale);


    languageSelect.addEventListener(
        'change',
        event => {

            const locale =
                event.target.value;

            saveLocale(locale);

            render(locale);

        }
    );


    document.querySelector('#year').textContent =
        new Date().getFullYear();

</script>

</body>
</html>
