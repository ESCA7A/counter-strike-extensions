<!doctype html><html lang="ru-RU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects — ESCA7A</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../components/projects/projects.css"></head><body><header class="site-header"><div class="nav-shell"><a class="brand" href="../">ESCA7A<span>.</span></a><a href="../">← Home</a></div></header><main class="section-shell" style="padding:100px 0"><div class="eyebrow">PROJECTS</div><h1 style="font-size:clamp(48px,7vw,84px);letter-spacing:-.06em">Tools for CS2 & FACEIT.</h1><div id="project-list" style="display:grid;gap:14px;margin-top:40px"></div></main><script type="module">import { getProjects, getPath, detectLocale } from '../config/loader.js'; const locale=detectLocale(); const root=document.querySelector('#project-list'); getProjects().forEach(p=>{const m=p.meta[locale.split('-')[0]]||p.meta.en; root.insertAdjacentHTML('beforeend',`<a href="${getPath(p.route)}" style="display:block;padding:28px;border:1px solid var(--border);border-radius:8px;background:var(--surface)"><strong style="font-size:28px">${m.name}</strong><div style="color:var(--muted);margin-top:6px">${m.short}</div></a>`)});</script></body></html>
